<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><rect width="1000" height="620" fill="#f5f7fb"/><g font-family="sans-serif" fill="#16243b"><text x="40" y="44" font-size="25" font-weight="bold">CC K线包含：先建立方向，再逐根处理</text><rect x="40" y="75" width="920" height="78" rx="12" fill="white" stroke="#86a5ce"/><text x="60" y="104" font-size="21" font-weight="bold">1  未定向：保存到前导缓冲</text><text x="60" y="132" font-size="18">比较最新两根原始K线；高低点同时严格上移或下移才得到方向。</text><path d="M500 155 v20 m-6 -7 l6 7 6 -7" stroke="#557cae" fill="none"/><rect x="40" y="179" width="920" height="78" rx="12" fill="white" stroke="#86a5ce"/><text x="60" y="208" font-size="21" font-weight="bold">2  首次定向：处理前导组</text><text x="60" y="236" font-size="18">按新方向聚合此前成员；触发方向的最新K线另建第二单元。</text><path d="M500 259 v20 m-6 -7 l6 7 6 -7" stroke="#557cae" fill="none"/><rect x="40" y="283" width="920" height="78" rx="12" fill="white" stroke="#86a5ce"/><text x="60" y="312" font-size="21" font-weight="bold">3  常规输入：比较新K线与末端合并单元</text><text x="60" y="340" font-size="18">任一方完整包含另一方（含相等边界），则进入包含分支。</text><path d="M500 363 v20 m-6 -7 l6 7 6 -7" stroke="#557cae" fill="none"/><rect x="40" y="387" width="920" height="78" rx="12" fill="white" stroke="#86a5ce"/><text x="60" y="416" font-size="21" font-weight="bold">4  包含 → 吸收；非包含 → 新建</text><text x="60" y="444" font-size="18">吸收时沿用末单元方向；非包含时根据两者高低点确定新单元方向。</text><path d="M500 467 v20 m-6 -7 l6 7 6 -7" stroke="#557cae" fill="none"/><rect x="40" y="491" width="920" height="78" rx="12" fill="white" stroke="#86a5ce"/><text x="60" y="520" font-size="21" font-weight="bold">5  输出：区间、方向与来源范围</text><text x="60" y="548" font-size="18">正常追加时最后单元仍可变化；末根修订走撤回后重新追加路径。</text></g></svg>