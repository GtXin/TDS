<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="516" viewBox="0 0 1000 516"><rect width="1000" height="516" fill="#f5f7fb"/><g font-family="sans-serif" fill="#16243b"><text x="40" y="44" font-size="25" font-weight="bold">同一组包含区间：方向决定保留哪一侧</text><rect x="40" y="75" width="920" height="78" rx="12" fill="white" stroke="#86a5ce"/><text x="60" y="104" font-size="21" font-weight="bold">输入示例：旧单元 [5, 10]，新K线 [6, 9]</text><text x="60" y="132" font-size="18">新区间完整位于旧区间内；先判断包含，再使用已有方向。</text><path d="M500 155 v20 m-6 -7 l6 7 6 -7" stroke="#557cae" fill="none"/><rect x="40" y="179" width="920" height="78" rx="12" fill="white" stroke="#86a5ce"/><text x="60" y="208" font-size="21" font-weight="bold">已有方向向上：max / max → [6, 10]</text><text x="60" y="236" font-size="18">低点取 max(5, 6) = 6；高点取 max(10, 9) = 10。</text><path d="M500 259 v20 m-6 -7 l6 7 6 -7" stroke="#557cae" fill="none"/><rect x="40" y="283" width="920" height="78" rx="12" fill="white" stroke="#86a5ce"/><text x="60" y="312" font-size="21" font-weight="bold">已有方向向下：min / min → [5, 9]</text><text x="60" y="340" font-size="18">低点取 min(5, 6) = 5；高点取 min(10, 9) = 9。</text><path d="M500 363 v20 m-6 -7 l6 7 6 -7" stroke="#557cae" fill="none"/><rect x="40" y="387" width="920" height="78" rx="12" fill="white" stroke="#86a5ce"/><text x="60" y="416" font-size="21" font-weight="bold">方向从哪里来？</text><text x="60" y="444" font-size="18">来自该末单元已保存的方向；不根据这一根K线的阴阳或收盘涨跌重判。</text></g></svg>